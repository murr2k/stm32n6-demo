# west manifest for the STM32N6570-DK graphics demo.
# T3 topology: the project root is the west workspace, this app holds the
# manifest, Zephyr and its modules are cloned beside it by `west update`.
#
# Pinned to v4.4.0, the same tag the sibling STM32N6570-DK project boots.
# STM32N6 support on main still churns; bump deliberately, not by default.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: stm32-hotspot
      url-base: https://github.com/stm32-hotspot

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - cmsis-dsp
          - hal_stm32
          - hal_st
          - picolibc
          - segger
          - mbedtls
          - mbedtls-3.6
          - tf-psa-crypto
          - mcuboot
          - zcbor
          - lvgl
          - littlefs
          - fatfs

    # ST's camera ISP (auto exposure, white balance, colour) for the DCMIPP
    # driver, tuned for the IMX335. Licence: ST SLA0044, use on ST devices;
    # it must not be put under open-source terms, so it is fetched here and
    # never copied into this repository.
    - name: zephyr-stm32-mw-isp
      remote: stm32-hotspot
      revision: v0.4.0
      path: st/lib/zephyr-stm32-mw-isp
      submodules: true

    # zprof (Apache-2.0): runtime tracing and timing analysis over the board's
    # Ethernet, in the browser; part of every build. Its Zephyr module is in
    # firmware/zprof, where module discovery does not look (it reads only
    # <project>/zephyr/module.yml), so app/CMakeLists.txt adds it, with the
    # demo's settings in app/zprof.conf. Its host tools (the bridge, the
    # dashboard) run from this checkout too.
    - name: zprof
      url: https://github.com/murr2k/zprof
      revision: v0.4.1
      path: zprof

  self:
    path: app
