# LVGL's own profiler points as zprof spans: a development build only.
#   .\n6.cmd build -- -Dapp_EXTRA_CONF_FILE=zprof-lvgl.conf    (every LVGL source compiles again)
# Then zprof_bridge capture --spans 20 shows what a frame is made of (layout, refresh,
# draw tasks, events), and summary --frames-with "Flight Deck" that screen's first
# frames. Not in the normal build: 6.5 KB of flash, and while recording, a frame that
# draws a whole screen makes about 4,000 spans and runs about a fifth longer (Deck's
# first frame 12.9 ms became 15.4 ms, 2026-11-23): read spans for structure, time frames
# from a build or a capture without them. Off (no client asking), the transition test
# could not tell it from the normal build.
# SPDX-License-Identifier: Apache-2.0

CONFIG_ZPROF_LVGL=y
CONFIG_LV_USE_PROFILER_BUILTIN=n
# per glyph, per cache or file access, per input read: thousands of calls for little
CONFIG_LV_PROFILER_FONT=n
CONFIG_LV_PROFILER_CACHE=n
CONFIG_LV_PROFILER_FS=n
CONFIG_LV_PROFILER_INDEV=n
