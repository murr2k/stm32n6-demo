# zprof, the tracer (https://github.com/murr2k/zprof), in every build of the demo:
# app/CMakeLists.txt adds this file and zprof's module unless built with -DZPROF=OFF
# (n6.cmd --no-zprof). The bridge finds the board by prof=5560 in its discovery answer.
# SPDX-License-Identifier: Apache-2.0

CONFIG_TRACING=y
CONFIG_TRACING_CUSTOM=y
CONFIG_ZPROF=y

# The sender just below the UI thread (0): at the module's default (14) the
# NPU's 65 to 130 ms runs and the video decoder starved it and the ring
# overflowed (3.6 million records of a tour lost with kernel-object events). It
# wakes every 10 ms for a short send; the demo's deadlines decide (tour.py).
CONFIG_ZPROF_SENDER_PRIO=1

# The demo's network bursts (a 1.5 MB screenshot, uploads) make up to 130,000
# events a second; 32 KB dropped 0.13 % of the events of a tour, in those
# bursts. It sits in the M55's DTCM, not internal RAM (zprof's ZPROF_RING_DTCM,
# on because the overlay chooses zephyr,dtcm).
CONFIG_ZPROF_RING_SIZE=65536

# Capture-then-upload: 4 MB of PSRAM (from psram_alloc, taken at the first capture;
# about 7.8 MB are free after a tour), 16 s at 250 KB/s of events.
CONFIG_ZPROF_CAPTURE_KB=4096

# Default y with TRACING, and wrong for zprof: every syscall site would be a
# hook, and the network classes (sockets, IP core) would trace zprof's own
# packets.
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_NETWORKING=n
CONFIG_TRACING_PM=n
