# --- kernel / libc -----------------------------------------------------------
# Internal RAM is the scarce resource (840 KB, two frame buffers take the
# rest of the SRAM): sizes follow measured peaks, 2026-11-19 after a tour
# (ctl.py mem stacks): main stack 5.8 KB used, kernel heap 140 B (getaddrinfo).
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_FPU=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# --- console / logging -------------------------------------------------------
# Deferred: immediate mode masks interrupts for a whole UART line (milliseconds).
# To chase an early hang, build with: n6.cmd build -- -Dapp_EXTRA_CONF_FILE=debug.conf
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_PRINTK=y

# --- display -----------------------------------------------------------------
# FB_NUM=0: the app owns both frame buffers and swaps the LTDC layer's
# address itself (present() in src/platform/gfx.c, no copy); the driver sets
# up the LTDC and the panel.
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_ARGB8888=y
CONFIG_STM32_LTDC_FB_NUM=0

# --- LVGL --------------------------------------------------------------------
# The app creates the display and input devices itself (src/platform), so the
# Zephyr glue only supplies the heap and lv_conf.
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
CONFIG_LV_Z_POINTER_INPUT=n
CONFIG_LV_Z_FLUSH_THREAD=n
# Every screen's objects are built at boot and kept: 100 KB in use, 108 KB
# peak after a tour (2026-11-19; Home Power added about 13 KB).
CONFIG_LV_Z_MEM_POOL_SIZE=196608
CONFIG_LV_COLOR_DEPTH_32=y
CONFIG_LV_DEF_REFR_PERIOD=4
CONFIG_LV_DPI_DEF=160
CONFIG_LV_DRAW_SW_ASM_HELIUM=y
CONFIG_LV_USE_NATIVE_HELIUM_ASM=y
CONFIG_LV_USE_DRAW_SW_COMPLEX_GRADIENTS=y
CONFIG_LV_USE_FLOAT=y
CONFIG_LV_USE_THEME_DEFAULT=n
CONFIG_LV_USE_SNAPSHOT=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_QRCODE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y

# --- touch -------------------------------------------------------------------
CONFIG_INPUT=y
CONFIG_INPUT_GT911_INTERRUPT=y
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=5
# Callbacks run in the reporting context (the GT911 work item), not through
# Zephyr's 16-event queue and lowest-priority thread: the driver sends 4
# events per contact in one burst and the queue drops what does not fit,
# releases included (a contact then stays down for good).
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# --- stacks and symbols ---------------------------------------------------------
# Stacks are filled with a pattern at thread creation, so `ctl.py stacks` can
# show each thread's high-water mark (k_thread_stack_space_get).
CONFIG_INIT_STACKS=y
# Every function's name in the image (about 95 KB of flash): a fault prints its
# call trace with names (the extra exception information turns on the stack
# walk and its unwind tables, 23 KB). See app/CMakeLists.txt for the linker
# snippet the symbol table needs.
CONFIG_SYMTAB=y
CONFIG_EXTRA_EXCEPTION_INFO=y

# --- camera ---------------------------------------------------------------------
# IMX335 through the DCMIPP (shield set in CMakeLists.txt). The frame buffers
# are in PSRAM, imported (media/camera.c); the video layer's own pool, which
# would sit in internal RAM, only needs its minimum.
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=4096
# ST's ISP (west module zephyr-stm32-mw-isp, licence SLA0044): exposure,
# white balance and colour for the IMX335
CONFIG_USE_STM32_MW_ISP=y

# --- recorder ---------------------------------------------------------------------
# The hardware H.264 encoder (VENC). The driver brings ST's encoder library
# (BSD-3-Clause, with the HAL) and its memory pool, which the board puts in
# PSRAM; the recorder (media/recorder.c) calls the library itself. 800 x 480
# needs far less than the default 7 MB.
CONFIG_VIDEO_ENCODER_H264=y
CONFIG_VIDEO_STM32_VENC_HEAP_SIZE=3145728

# --- network -----------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="n6demo"
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
# The Ethernet receive thread and the TCP work queue stay cooperative but run
# below the audio refill (K_PRIO_COOP(2)) and the microphone (3): at their
# default, 2, they were the audio threads' largest interference, a network
# burst ahead of a refill (zprof, 2026-11-22). 4 is K_PRIO_COOP(4), still above
# every preemptible thread.
CONFIG_ETH_STM32_HAL_RX_THREAD_PRIO=4
CONFIG_NET_TCP_WORKER_PRIO=4
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072
# Three services (screenshots, control, host link) plus their accepted
# connections: the defaults (4 handlers, 6 contexts) run out and new
# connections are refused.
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16
# SO_RCVTIMEO / SO_SNDTIMEO are applied only with these: without them the
# servers' idle timeouts (control 5 s, upload 10 s, screenshot) were silently
# ignored, and a client that left its connection open held the port, served
# one client at a time, until a restart (found 2026-11-19).
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_ZVFS_OPEN_MAX=24
# Announce the address when it is assigned. Without this a host that kept
# sending to the board while it power-cycled (the companion) holds a stale
# ARP entry and Windows does not resolve the board again for up to a minute.
CONFIG_NET_ARP_GRATUITOUS_TRANSMISSION=y
# Names, for Home Power's energy monitor (platform/homepower.c): the server
# comes from DHCP, or is the gateway with a fixed address (net.c).
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n

# --- microSD card (media library) --------------------------------------------
# FAT32 and exFAT, long names. Never format: the card is the user's.
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=128
# Three threads use the card: the player's reader, the upload service and the
# UI thread when it scans the library.
CONFIG_FS_FATFS_REENTRANT=y
# The SDMMC's internal DMA writes straight into the caller's buffer and the
# driver invalidates the data cache over it: keep FatFs's own sector buffer on
# cache-line boundaries.
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=32
CONFIG_SDMMC_STM32_HWFC=y

# --- DSP ---------------------------------------------------------------------
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_STATISTICS=y

# --- audio -------------------------------------------------------------------
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_NOCACHE_MEMORY=y
