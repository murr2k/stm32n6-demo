# --- kernel / libc -----------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_FPU=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# --- console / logging -------------------------------------------------------
# Deferred: immediate mode masks interrupts for a whole UART line (milliseconds).
# To chase an early hang, build with: n6.cmd build -- -Dapp_EXTRA_CONF_FILE=debug.conf
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_PRINTK=y

# --- display -----------------------------------------------------------------
# FB_NUM=0: the app owns both frame buffers and hands full frames to the
# driver, which swaps the LTDC pointer in the line interrupt (no copy).
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_ARGB8888=y
CONFIG_STM32_LTDC_FB_NUM=0

# --- LVGL --------------------------------------------------------------------
# The app creates the display and input devices itself (src/platform), so the
# Zephyr glue only supplies the heap and lv_conf.
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
CONFIG_LV_Z_POINTER_INPUT=n
CONFIG_LV_Z_FLUSH_THREAD=n
CONFIG_LV_Z_MEM_POOL_SIZE=262144
CONFIG_LV_COLOR_DEPTH_32=y
CONFIG_LV_DEF_REFR_PERIOD=4
CONFIG_LV_DPI_DEF=160
CONFIG_LV_DRAW_SW_ASM_HELIUM=y
CONFIG_LV_USE_NATIVE_HELIUM_ASM=y
CONFIG_LV_USE_DRAW_SW_COMPLEX_GRADIENTS=y
CONFIG_LV_USE_FLOAT=y
CONFIG_LV_USE_THEME_DEFAULT=n
CONFIG_LV_USE_SNAPSHOT=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_QRCODE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y

# --- touch -------------------------------------------------------------------
CONFIG_INPUT=y
CONFIG_INPUT_GT911_INTERRUPT=y
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=5
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# --- network -----------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="n6demo"
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072
# Three services (screenshots, control, host link) plus their accepted
# connections: the defaults (4 handlers, 6 contexts) run out and new
# connections are refused.
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_ZVFS_OPEN_MAX=24
# Announce the address when it is assigned. Without this a host that kept
# sending to the board while it power-cycled (the companion) holds a stale
# ARP entry and Windows does not resolve the board again for up to a minute.
CONFIG_NET_ARP_GRATUITOUS_TRANSMISSION=y

# --- microSD card (media library) --------------------------------------------
# FAT32 and exFAT, long names. Never format: the card is the user's.
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=128
# Three threads use the card: the player's reader, the upload service and the
# UI thread when it scans the library.
CONFIG_FS_FATFS_REENTRANT=y
# The SDMMC's internal DMA writes straight into the caller's buffer and the
# driver invalidates the data cache over it: keep FatFs's own sector buffer on
# cache-line boundaries.
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=32
CONFIG_SDMMC_STM32_HWFC=y

# --- DSP ---------------------------------------------------------------------
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_STATISTICS=y

# --- audio -------------------------------------------------------------------
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_NOCACHE_MEMORY=y
