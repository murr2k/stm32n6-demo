# SEGGER SystemView build: every thread switch, interrupt and kernel call,
# streamed over RTT to SystemView through a J-Link (the J-Trace on CN10).
# Not the release firmware: tracing costs time on every event, and flash.
# Built into its own directory so build/ stays the release:
#   n6.cmd -d build-sysview build -p -- '-Dapp_EXTRA_CONF_FILE=sysview.conf'
# (quoted: PowerShell splits an unquoted -D argument at the dot)
#   n6.cmd -d build-sysview go --app-only
# and back to the release: n6.cmd go --app-only
CONFIG_TRACING=y
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_SEGGER_SYSVIEW_RTT_BUFFER_SIZE=16384
CONFIG_SEGGER_SYSVIEW_APP_NAME="stm32n6-demo"
